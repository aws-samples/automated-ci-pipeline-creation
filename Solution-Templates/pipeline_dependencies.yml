# This code launches the dependent resources for CI pipeline creation i.e., S3 buckets, IAM Roles, Policies, etc.
AWSTemplateFormatVersion: 2010-09-09
Description: Creation of IAM Roles & Policies for Codepipeline and Codebuild, Deployment Artifact bucket and its access log bucket, and SSM Parameters.

Resources:
  # Sample-only exceptions, accepted on purpose (see SECURITY.md):
  # - Object Lock is not turned on, because it would block the clean-up steps.
  # - AccessControl is not set. ACLs are turned off with BucketOwnerEnforced and public access is blocked.
  # - Cross-Region replication is not required for this sample.
  # Receives the S3 server access logs of the deployment artifact bucket.
  # S3 can't deliver access logs to a bucket that uses SSE-KMS, so this bucket uses SSE-S3.
  DeploymentArtifactLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_REPLICATION_ENABLED
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join
        - "-"
        - - "deployment-artifact-bucket-logs"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      # The log bucket logs to itself because a resource can't reference itself. The logs expire with the lifecycle rule.
      LoggingConfiguration:
        DestinationBucketName: !Join
          - "-"
          - - "deployment-artifact-bucket-logs"
            - !Select
              - 0
              - !Split
                - "-"
                - !Select
                  - 2
                  - !Split
                    - "/"
                    - !Ref "AWS::StackId"
        LogFilePrefix: log-bucket-logs/
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  DeploymentArtifactLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifactLogBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource:
              - !Sub "${DeploymentArtifactLogBucket.Arn}/artifact-bucket-logs/*"
              - !Sub "${DeploymentArtifactLogBucket.Arn}/log-bucket-logs/*"
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !GetAtt DeploymentArtifactBucket.Arn
                  - !GetAtt DeploymentArtifactLogBucket.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactLogBucket.Arn
              - !Sub "${DeploymentArtifactLogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
          - S3_BUCKET_REPLICATION_ENABLED
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join
        - "-"
        - - "deployment-artifact-bucket"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref DeploymentArtifactLogBucket
        LogFilePrefix: artifact-bucket-logs/

  DeploymentArtifactBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: DeploymentArtifactBucketName
      Type: String
      Value: !Ref 'DeploymentArtifactBucket'
      Description: Deployment Artifact bucket Name for the pipelines

  DeploymentArtifactBucketARN:
    Type: AWS::SSM::Parameter
    Properties:
      Name: DeploymentArtifactBucketARN
      Type: String
      Value: !GetAtt DeploymentArtifactBucket.Arn
      Description: Deployment Artifact bucket ARN for the pipelines

  DeploymentArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifactBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: PolicyforAllowtoUploadObjects
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Effect: Allow
            Resource: !Sub "${DeploymentArtifactBucket.Arn}/*"
            Principal:
              AWS:
                - !GetAtt CodeBuildRole.Arn
                - !GetAtt CodePipelineServiceRole.Arn
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactBucket.Arn
              - !Sub "${DeploymentArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  CodeBuildPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit names are used for this policy to restrict the access of the statemachine role in the main template.
    Properties:
      ManagedPolicyName: !Join
        - '-'
        - - 'codebuild-policy'
          - !Ref 'AWS::Region'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*-Build"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*-Build:log-stream:*"
          - Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Effect: Allow
            Resource: !Sub "${DeploymentArtifactBucket.Arn}/*"
          - Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Effect: Allow
            Resource: !GetAtt DeploymentArtifactBucket.Arn
          - Action:
              - codebuild:CreateReportGroup
              - codebuild:CreateReport
              - codebuild:UpdateReport
              - codebuild:BatchPutTestCases
              - codebuild:BatchPutCodeCoverages
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*-Build-*"
      Roles:
        - !Ref 'CodeBuildRole'

  CodeBuildRole:
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Path: /
      RoleName: !Join
        - '-'
        - - 'Codebuild-Role'
          - !Ref 'AWS::Region'
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit names are used for this iam role.

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit names are used for this iam role.
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      RoleName: !Join
        - '-'
        - - 'Codepipeline-Role'
          - !Ref 'AWS::Region'

  CodePipelineServicePolicy:
    # This policy lets the pipeline read the source repository, store artifacts and start the CodeBuild project.
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit names are used for this policy to restrict the access of the statemachine role in the main template.
    Properties:
      ManagedPolicyName: !Join
        - '-'
        - - 'codepipeline-policy'
          - !Ref 'AWS::Region'
      Roles:
        - !Ref CodePipelineServiceRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Effect: Allow
            Resource: !Sub "${DeploymentArtifactBucket.Arn}/*"
          - Action:
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:ListBucket
            Effect: Allow
            Resource: !GetAtt DeploymentArtifactBucket.Arn
          - Effect: Allow
            Action:
              - codebuild:RetryBuild
              - codebuild:StartBuild
              - codebuild:StopBuild
              - codebuild:BatchGetBuilds
              - codebuild:BatchGetProjects
            Resource:
              - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/*-Build"
          - Effect: Allow
            Action:
              - codecommit:BatchGetCommits
              - codecommit:BatchGetRepositories
              - codecommit:GetBranch
              - codecommit:GetCommit
              - codecommit:GetRepository
              - codecommit:GetUploadArchiveStatus
              - codecommit:GitPull
              - codecommit:ListBranches
              - codecommit:UploadArchive
            Resource:
              - !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:*-Repo"

  CodePipelineServiceARN:
    Type: AWS::SSM::Parameter
    Properties:
      Name: CodePipelineServiceRoleARN
      Type: String
      Value: !GetAtt CodePipelineServiceRole.Arn
      Description: SSM Parameter for storing CodePipelineServiceRole ARN

  CodeBuildRoleARN:
    Type: AWS::SSM::Parameter
    Properties:
      Name: CodeBuildRoleARN
      Type: String
      Value: !GetAtt CodeBuildRole.Arn
      Description: SSM Parameter for storing CodeBuildRole ARN

  CodeBuildRoleName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: CodeBuildRoleName
      Type: String
      Value: !Ref 'CodeBuildRole'
      Description: SSM Parameter for storing CodeBuildRole Name
