# This code launches the solution resources for CI pipeline creation i.e., State Machine, DynamoDB table, Lambda Function, IAM Roles & Policies.
AWSTemplateFormatVersion: 2010-09-09
Description: Creation of Lambda Function, Step Function and DynamoDB table along with required IAM roles & policies.
Parameters:
  S3TemplateBucketName:
    Type: String
    Description: The name of the S3 bucket which has the source code and references. BucketName should be in lowercase.
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    ConstraintDescription: Must be a valid, lowercase S3 bucket name.
  StateMachineName:
    Type: String
    Description: The name of the state machine.
    Default: "statemachine-ci-pipelinecreation"
    AllowedPattern: ^[A-Za-z0-9_-]{1,80}$
  DynamoDBTable:
    Type: String
    Description: The name of the DynamoDB Table.
    Default: "DynamoDB-pipelinecreation"
    AllowedPattern: ^[A-Za-z0-9_.-]{3,255}$

Resources:
  # Customer managed key for the DynamoDB table and the state machine log group.
  SolutionKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the pipeline creation DynamoDB table and state machine logs
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsForTheStateMachineLogGroup
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${StateMachineName}"

  DynamoDBTableStateMachine:
    Type: AWS::DynamoDB::Table
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit names are used for the dynamodb table.
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: "PROVISIONED"
      AttributeDefinitions:
        - AttributeName: "techstack"
          AttributeType: "S"
        - AttributeName: "projectname"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "techstack"
          KeyType: "HASH"
        - AttributeName: "projectname"
          KeyType: "RANGE"
      ProvisionedThroughput:
        ReadCapacityUnits: "5"
        WriteCapacityUnits: "5"
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt SolutionKmsKey.Arn
      TableName: !Ref "DynamoDBTable"
      TableClass: "STANDARD"

  AWSLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXrayWriteOnlyAccess"

  # The function reads the buildspec fragments and the sample code, and writes the generated files.
  AWSLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles:
        - !Ref "AWSLambdaRole"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: s3:ListBucket
            Effect: Allow
            Resource: !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}"
            Condition:
              StringLike:
                s3:prefix:
                  - "samplecode/*"
          - Action: s3:GetObject
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/input-references/*"
              - !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/samplecode/*"
          - Action: s3:PutObject
            Effect: Allow
            Resource: !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/generated-artifacts/*"

  # Used by the state machine itself: DynamoDB, Lambda and the CloudFormation API calls.
  StateMachineWorkflowPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      guard:
        SuppressedRules:
          - IAM_POLICYDOCUMENT_NO_WILDCARD_RESOURCE
    Properties:
      Roles:
        - !Ref "StateMachineRole"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Effect: Allow
            Resource: !GetAtt DynamoDBTableStateMachine.Arn
          - Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Effect: Allow
            Resource: !GetAtt SolutionKmsKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub "dynamodb.${AWS::Region}.amazonaws.com"
          - Action: lambda:InvokeFunction
            Effect: Allow
            Resource: !GetAtt AWSLambdaFunction.Arn
          - Action:
              - cloudformation:DescribeStacks
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/pipeline-creation-dependencies-stack/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*-Stack/*"
          - Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/pipeline-creation-dependencies-stack/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*-Stack/*"
            Condition:
              StringEquals:
                cloudformation:TemplateUrl:
                  - !Sub "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipeline_dependencies.yml"
                  - !Sub "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipelinecreation_stack.yml"
          - # These log delivery actions do not support resource-level permissions.
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Effect: Allow
            Resource: "*"

  # CloudFormation uses the permissions of the state machine role when it creates the dependencies stack and the pipeline stacks.
  StackDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      guard:
        SuppressedRules:
          - IAM_POLICYDOCUMENT_NO_WILDCARD_RESOURCE
    Properties:
      Roles:
        - !Ref "StateMachineRole"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadTemplatesAndGeneratedArtifacts
            Action: s3:GetObject
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/pipeline_dependencies.yml"
              - !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/pipelinecreation_stack.yml"
              - !Sub "arn:${AWS::Partition}:s3:::${S3TemplateBucketName}/generated-artifacts/*"
          - Sid: DeploymentArtifactBuckets
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucket*
              - s3:PutBucket*
              - s3:PutEncryptionConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetLifecycleConfiguration
            Effect: Allow
            Resource: !Sub "arn:${AWS::Partition}:s3:::deployment-artifact-bucket*"
          - Sid: ParametersForTheOtherStacks
            Action:
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:AddTagsToResource
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/S3TemplateBucketName"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/DeploymentArtifactBucketName"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/DeploymentArtifactBucketARN"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/CodePipelineServiceRoleARN"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/CodeBuildRoleARN"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/CodeBuildRoleName"
          - Sid: PipelineRolesAndPolicies
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListEntitiesForPolicy
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codebuild-Role-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codepipeline-Role-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/codebuild-policy-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/codepipeline-policy-${AWS::Region}"
          - Sid: AttachOnlyThePipelinePolicies
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codebuild-Role-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codepipeline-Role-${AWS::Region}"
            Condition:
              ArnEquals:
                iam:PolicyARN:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/codebuild-policy-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/codepipeline-policy-${AWS::Region}"
          - Sid: PassTheRolesToTheirServices
            Action: iam:PassRole
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codebuild-Role-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Codepipeline-Role-${AWS::Region}"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - codebuild.amazonaws.com
                  - codepipeline.amazonaws.com
          - Sid: CodeCommitRepositories
            Action:
              - codecommit:CreateRepository
              - codecommit:DeleteRepository
              - codecommit:GetRepository
              - codecommit:CreateBranch
              - codecommit:CreateCommit
              - codecommit:PutFile
              - codecommit:GetBranch
              - codecommit:GetFile
              - codecommit:UpdateRepositoryDescription
              - codecommit:TagResource
              - codecommit:ListTagsForResource
            Effect: Allow
            Resource: !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:*-Repo"
          - Sid: ListRepositories
            # CloudFormation lists repositories when it deletes one. This action does not support resource-level permissions.
            Action: codecommit:ListRepositories
            Effect: Allow
            Resource: "*"
          - Sid: CodeBuildProjects
            Action:
              - codebuild:CreateProject
              - codebuild:UpdateProject
              - codebuild:DeleteProject
              - codebuild:BatchGetProjects
            Effect: Allow
            Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/*-Build"
          - Sid: CodePipelinePipelines
            Action:
              - codepipeline:CreatePipeline
              - codepipeline:UpdatePipeline
              - codepipeline:DeletePipeline
              - codepipeline:GetPipeline
              - codepipeline:ListTagsForResource
              - codepipeline:TagResource
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:*-Pipeline"
              - !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:*-Pipeline/*"
              - !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:*-Pipeline/*/*"

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AWSLambdaFunction:
    Type: AWS::Lambda::Function
    #checkov:skip=CKV_AWS_173:By default Lambda uses an AWS KMS key that Lambda creates in your account to encrypt your environment variables
    #checkov:skip=CKV_AWS_115:Concurrency is not required at this level for this function
    #checkov:skip=CKV_AWS_117:VPC is not required for this lambda function
    #checkov:skip=CKV_AWS_116:Dead Letter queue is not configured for this lambda function as it doesn't have any asynchronous invocations
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_DLQ_CHECK
          - LAMBDA_CONCURRENCY_CHECK
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Lambda function is not owned by VPC.
          - id: W92
            reason: reserve simultaneous executions is not required for this function
    Properties:
      Runtime: "python3.13"
      Role: !GetAtt AWSLambdaRole.Arn
      Handler: "index.lambda_handler"
      Timeout: 300
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          import io
          import os
          import re
          import textwrap
          import zipfile

          import boto3

          s3 = boto3.client("s3")
          BUCKET = os.environ["S3_Bucket_Name"]
          TECH_STACKS = ("java", "python")
          NAME_PATTERN = re.compile(r"^[A-Za-z0-9-]{1,40}$")


          def fragment(key):
            """Reads a buildspec fragment from S3 and removes the leading comment lines."""
            body = s3.get_object(Bucket=BUCKET, Key=key)["Body"].read().decode("utf-8")
            lines = body.splitlines()
            while lines and (not lines[0].strip() or lines[0].lstrip().startswith(("#", "---"))):
              lines.pop(0)
            return textwrap.dedent("\n".join(lines)).rstrip()


          def build_buildspec(details):
            prefix = "input-references/" + details["tech_stack"] + "/"
            # common.yml ends with "phases:", so the phase fragments are added below it, indented by two spaces.
            parts = [fragment(prefix + "common.yml")]
            phases = ["installation"]
            phases += [p for p in ("pre_build", "build", "post_build") if details[p] == "yes"]
            for phase in phases:
              parts.append(textwrap.indent(fragment(prefix + phase + ".yml"), "  "))
            if details["reports"] == "yes" and details["build"] == "yes":
              parts.append(fragment(prefix + "reports.yml"))
            return "\n".join(parts) + "\n"


          def lambda_handler(event, context):
            tech_stack = event.get("tech_stack")
            project = event.get("project_name", "")
            if tech_stack not in TECH_STACKS:
              raise ValueError("tech_stack must be one of " + ", ".join(TECH_STACKS))
            if not NAME_PATTERN.match(project):
              raise ValueError("project_name must use 1 to 40 letters, numbers or hyphens")
            for stage in ("pre_build", "build", "post_build", "reports"):
              if event.get(stage) not in ("yes", "no"):
                raise ValueError(stage + " must be yes or no")

            output_prefix = "generated-artifacts/" + tech_stack + "/" + project + "/"
            buildspec = build_buildspec(event)
            s3.put_object(Bucket=BUCKET, Key=output_prefix + "buildspec.yml", Body=buildspec.encode("utf-8"))

            # Zip the sample code together with the generated buildspec for the CodeCommit repository.
            source_prefix = "samplecode/" + tech_stack + "/"
            archive = io.BytesIO()
            with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zipper:
              zipper.writestr("buildspec.yml", buildspec)
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=BUCKET, Prefix=source_prefix):
                for item in page.get("Contents", []):
                  name = item["Key"][len(source_prefix):]
                  if name and name != "buildspec.yml":
                    zipper.writestr(name, s3.get_object(Bucket=BUCKET, Key=item["Key"])["Body"].read())
            s3.put_object(Bucket=BUCKET, Key=output_prefix + tech_stack + "-templates.zip", Body=archive.getvalue())
            return 200
      Description: The function generates the buildspec.yml file from the references and zips it with the sample code.
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          S3_Bucket_Name: !Ref "S3TemplateBucketName"

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${StateMachineName}"
      KmsKeyId: !GetAtt SolutionKmsKey.Arn
      RetentionInDays: 30

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - StateMachineWorkflowPolicy
    Properties:
      DefinitionString: !Sub |
        {
          "Comment": "Creates a CI pipeline for a Java or Python project",
          "StartAt": "Pipeline creation request received",
          "TimeoutSeconds": 3600,
          "States": {
            "Pipeline creation request received": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${DynamoDBTable}",
                "Item": {
                  "techstack": {
                    "S.$": "$.tech_stack"
                  },
                  "projectname": {
                    "S.$": "$.project_name"
                  },
                  "pipelinestatus": {
                    "S": "Request received for pipeline creation."
                  }
                }
              },
              "Next": "Invoke Pipeline Creation",
              "InputPath": "$.details",
              "ResultPath": null
            },
            "Invoke Pipeline Creation": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "Payload.$": "$",
                "FunctionName": "${AWSLambdaFunction}"
              },
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 6,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "Record the failure",
                  "Next": "Record failure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "Check dependencies",
              "InputPath": "$.details",
              "ResultPath": null
            },
            "Check dependencies": {
              "Type": "Task",
              "Next": "Update dependencies",
              "Parameters": {
                "StackName": "pipeline-creation-dependencies-stack"
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
              "InputPath": "$.details",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed"
                  ],
                  "Next": "Create dependencies",
                  "Comment": "Dependencies do not exist",
                  "ResultPath": "$.input"
                }
              ]
            },
            "Update dependencies": {
              "Type": "Task",
              "Next": "Check dependency status",
              "Parameters": {
                "StackName": "pipeline-creation-dependencies-stack",
                "TemplateURL": "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipeline_dependencies.yml",
                "Capabilities": [
                  "CAPABILITY_NAMED_IAM"
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:updateStack",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed"
                  ],
                  "Comment": "No updates",
                  "Next": "Check dependency status",
                  "ResultPath": "$.input"
                }
              ],
              "InputPath": "$.details",
              "ResultPath": null
            },
            "Create dependencies": {
              "Type": "Task",
              "Parameters": {
                "StackName": "pipeline-creation-dependencies-stack",
                "TemplateURL": "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipeline_dependencies.yml",
                "Capabilities": [
                  "CAPABILITY_NAMED_IAM"
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:createStack",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "Record the failure",
                  "Next": "Record failure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "Check dependency status",
              "InputPath": "$.details",
              "ResultPath": null
            },
            "Check dependency status": {
              "Type": "Task",
              "Next": "Evaluate dependency status",
              "Parameters": {
                "StackName": "pipeline-creation-dependencies-stack"
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
              "InputPath": "$.details",
              "ResultPath": "$.pipelinestatus"
            },
            "Evaluate dependency status": {
              "Type": "Choice",
              "Choices": [
                {
                  "Or": [
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "CREATE_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_COMPLETE"
                    }
                  ],
                  "Next": "Pipeline creation Initiated"
                },
                {
                  "Or": [
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "CREATE_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_COMPLETE"
                    }
                  ],
                  "Next": "Record failure"
                }
              ],
              "Default": "Wait for dependency to be available"
            },
            "Wait for dependency to be available": {
              "Type": "Wait",
              "Seconds": 5,
              "Next": "Check dependency status",
              "InputPath": "$",
              "OutputPath": "$"
            },
            "Pipeline creation Initiated": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DynamoDBTable}",
                "Key": {
                  "techstack": {
                    "S.$": "$.tech_stack"
                  },
                  "projectname": {
                    "S.$": "$.project_name"
                  }
                },
                "UpdateExpression": "SET pipelinestatus = :newval",
                "ExpressionAttributeValues": {
                  ":newval": {
                    "S": "Pipeline creation Initiated"
                  }
                }
              },
              "InputPath": "$.details",
              "ResultPath": null,
              "Next": "Check Pipeline exists"
            },
            "Check Pipeline exists": {
              "Type": "Task",
              "Parameters": {
                "StackName.$": "States.Format('{}-Stack', $.project_name)"
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
              "InputPath": "$.details",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed"
                  ],
                  "Comment": "The pipeline stack does not exist",
                  "Next": "Create Pipeline",
                  "ResultPath": "$.input"
                }
              ],
              "Next": "Update Pipeline"
            },
            "Update Pipeline": {
              "Type": "Task",
              "Next": "Check Pipeline Creation/Update status",
              "Parameters": {
                "StackName.$": "States.Format('{}-Stack', $.project_name)",
                "TemplateURL": "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipelinecreation_stack.yml",
                "Parameters": [
                  {
                    "ParameterKey": "TechStack",
                    "ParameterValue.$": "$.tech_stack"
                  },
                  {
                    "ParameterKey": "ProjectName",
                    "ParameterValue.$": "$.project_name"
                  }
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:updateStack",
              "InputPath": "$.details",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed"
                  ],
                  "Comment": "No stack changes",
                  "Next": "Check Pipeline Creation/Update status",
                  "ResultPath": "$.input"
                }
              ]
            },
            "Create Pipeline": {
              "Type": "Task",
              "Parameters": {
                "StackName.$": "States.Format('{}-Stack', $.project_name)",
                "TemplateURL": "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipelinecreation_stack.yml",
                "Parameters": [
                  {
                    "ParameterKey": "TechStack",
                    "ParameterValue.$": "$.tech_stack"
                  },
                  {
                    "ParameterKey": "ProjectName",
                    "ParameterValue.$": "$.project_name"
                  }
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:createStack",
              "InputPath": "$.details",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "Record the failure",
                  "Next": "Record failure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "Check Pipeline Creation/Update status"
            },
            "Check Pipeline Creation/Update status": {
              "Type": "Task",
              "Parameters": {
                "StackName.$": "States.Format('{}-Stack', $.project_name)"
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
              "InputPath": "$.details",
              "ResultPath": "$.pipelinestatus",
              "Next": "Evaluate Pipeline creation status"
            },
            "Evaluate Pipeline creation status": {
              "Type": "Choice",
              "Choices": [
                {
                  "Or": [
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "CREATE_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_COMPLETE"
                    }
                  ],
                  "Next": "Pipeline creation completed successfully"
                },
                {
                  "Or": [
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "CREATE_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "ROLLBACK_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "UPDATE_ROLLBACK_COMPLETE"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_IN_PROGRESS"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_FAILED"
                    },
                    {
                      "Variable": "$.pipelinestatus.Stacks[0].StackStatus",
                      "StringEquals": "DELETE_COMPLETE"
                    }
                  ],
                  "Next": "Record failure"
                }
              ],
              "Default": "Waiting for Pipeline to be created"
            },
            "Waiting for Pipeline to be created": {
              "Type": "Wait",
              "Seconds": 10,
              "Next": "Check Pipeline Creation/Update status",
              "InputPath": "$",
              "OutputPath": "$"
            },
            "Pipeline creation completed successfully": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DynamoDBTable}",
                "Key": {
                  "techstack": {
                    "S.$": "$.tech_stack"
                  },
                  "projectname": {
                    "S.$": "$.project_name"
                  }
                },
                "UpdateExpression": "SET pipelinestatus = :newval",
                "ExpressionAttributeValues": {
                  ":newval": {
                    "S": "Pipeline created successfully"
                  }
                }
              },
              "InputPath": "$.details",
              "ResultPath": null,
              "End": true
            },
            "Record failure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DynamoDBTable}",
                "Key": {
                  "techstack": {
                    "S.$": "$.tech_stack"
                  },
                  "projectname": {
                    "S.$": "$.project_name"
                  }
                },
                "UpdateExpression": "SET pipelinestatus = :newval",
                "ExpressionAttributeValues": {
                  ":newval": {
                    "S": "Pipeline creation failed"
                  }
                }
              },
              "InputPath": "$.details",
              "ResultPath": null,
              "Next": "Pipeline creation failed"
            },
            "Pipeline creation failed": {
              "Type": "Fail",
              "Error": "PipelineCreationFailed",
              "Cause": "See the execution history and the pipeline stack events for details."
            }
          }
        }
      RoleArn: !GetAtt StateMachineRole.Arn
      StateMachineName: !Ref "StateMachineName"
      StateMachineType: STANDARD
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn

  S3TemplateBucketNameSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: S3TemplateBucketName
      Type: String
      Value: !Ref S3TemplateBucketName
      Description: Template bucket Name for the pipelines

  StatemachinePipelineDependencies:
    Type: AWS::SSM::Parameter
    Properties:
      Name: PipelineDependencyStackUrl
      Type: String
      Value: !Sub "https://${S3TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/pipeline_dependencies.yml"
      Description: SSM Parameter for pipeline dependency stack.

Outputs:
  StateMachineArn:
    Description: ARN of the state machine that creates the CI pipelines
    Value: !GetAtt StateMachine.Arn
